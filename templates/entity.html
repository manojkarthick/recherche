<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ heading }} – recherche</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/htmx.min.js"></script>
<script src="/assets/app.js" defer></script>
</head>
<body class="entity-page">
<header class="bar">
  <a class="wordmark small" href="/">recherche</a>
  <a class="back" href="/">Search</a>
</header>
<header class="entity-head">
  <div class="mrow">
    <div class="mg"><span>{{ kind }}</span><span>{{ count }}</span></div>
    <div>
      <h1 class="{{ ref_class }}">{{ crate::web::wbr(heading)|safe }}{% if let Some(g) = github %} <a class="ext" href="{{ g }}" target="_blank" rel="noopener noreferrer" title="Open on GitHub" aria-label="Open {{ heading }} on GitHub"></a>{% endif %}</h1>
      {% if let Some(h) = search_href %}<a class="scoped" href="{{ h }}">Search within these sessions</a>{% endif %}
    </div>
  </div>
</header>
<main id="results">{{ results_html|safe }}</main>
</body>
</html>
