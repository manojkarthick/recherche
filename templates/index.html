<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if q.is_empty() %}recherche{% else %}{{ q }} – recherche{% endif %}</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/htmx.min.js"></script>
<script src="/assets/sse.min.js"></script>
<script src="/assets/app.js" defer></script>
</head>
<body class="search-page">
<header class="masthead">
  <div class="masthead-inner">
    <a class="wordmark" href="/">recherche</a>
    <form id="search" action="/" method="get" role="search">
      <label class="visually-hidden" for="q">Search sessions</label>
      <div class="search-box">
        <span class="search-icon" aria-hidden="true"></span>
        <input id="q" name="q" type="search" value="{{ q }}" placeholder="Search {{ sessions }} sessions (keywords, repo:, branch:, PR#, ticket…)" autocomplete="off" spellcheck="false"{% if q.is_empty() %} autofocus{% endif %}
          hx-get="/search" hx-trigger="input changed delay:150ms, search" hx-target="#results" hx-include="#search-filters" hx-sync="this:replace">
        <kbd class="slash-hint" aria-hidden="true">/</kbd>
      </div>
    </form>
  </div>
</header>
<main id="results">{{ results_html|safe }}</main>
<footer class="keys"><kbd>/</kbd> search <kbd>j</kbd><kbd>k</kbd> navigate <kbd>Enter</kbd> open <kbd>c</kbd> copy cli</footer>
</body>
</html>
