<span class="ref-item"><a class="{{ c.class }}{% if c.hit %} hit{% endif %}" href="{{ c.href }}" title="{{ c.title }}">{{ c.label }}</a>{% if let Some(g) = c.github %}<a class="ext" href="{{ g }}" target="_blank" rel="noopener noreferrer" title="Open on GitHub" aria-label="Open {{ c.label }} on GitHub"></a>{% endif %}</span>
