[package]
name = "recherche"
version = "0.1.0"
edition = "2024"
description = "Search your past Claude Code and Codex sessions"
license = "MIT"

[dependencies]
anyhow = "1"
ammonia = "4"
askama = "0.16"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
fastembed = "7.7"
futures = "0.3"
gethostname = "1"
notify = "8"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tantivy = "0.27"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.clippy]
# SQL rows are read into tuples whose shape matches each query.
type_complexity = "allow"

[profile.release]
codegen-units = 4
strip = true
