name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and publish (for example v0.1.0)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  JRELEASER_VERSION: 1.27.0

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  resolve:
    needs: release-please
    if: >-
      always() && (needs.release-please.outputs.release_created == 'true' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable vX.Y.Z tag'; exit 1; }
          gh release view "$RELEASE_TAG" --json tagName
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    # resolve can run after release-please is skipped on manual dispatch.
    if: always() && needs.resolve.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.cache/ort.pyke.io
      - name: Check version and build
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          python3 -c 'import os,tomllib; assert tomllib.load(open("Cargo.toml", "rb"))["package"]["version"] == os.environ["VERSION"]'
          cargo build --release --locked --target "$TARGET"
      - uses: jreleaser/release-action@v2
        with:
          version: ${{ env.JRELEASER_VERSION }}
          arguments: assemble --select-current-platform
        env:
          JRELEASER_PROJECT_VERSION: ${{ needs.resolve.outputs.version }}
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
      - name: Test packaged binary
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          package="$RUNNER_TEMP/package"
          mkdir -p "$package"
          unzip -q "out/jreleaser/assemble/recherche/archive/recherche-$VERSION-$TARGET.zip" -d "$package"
          binary=$(find "$package" -type f -path '*/bin/recherche')
          bash scripts/release-smoke.sh "$binary" "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: out/jreleaser/assemble/recherche/archive/*.zip
          if-no-files-found: error

  publish:
    needs: [resolve, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      JRELEASER_PROJECT_VERSION: ${{ needs.resolve.outputs.version }}
      JRELEASER_TAG_NAME: ${{ needs.resolve.outputs.tag }}
      JRELEASER_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true
      - name: Validate archive set
        run: |
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            unzip -t "artifacts/recherche-$JRELEASER_PROJECT_VERSION-$target.zip"
          done
          test "$(find artifacts -name '*.zip' | wc -l)" -eq 3
      - uses: jreleaser/release-action@v2
        with:
          version: ${{ env.JRELEASER_VERSION }}
          arguments: prepare -PskipArchiveResolver
      - name: Validate formula syntax
        run: ruby -c out/jreleaser/prepare/recherche/brew/Formula/recherche.rb
      - uses: jreleaser/release-action@v2
        with:
          version: ${{ env.JRELEASER_VERSION }}
          arguments: release -PskipArchiveResolver
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: out/jreleaser/prepare/recherche/brew/Formula/recherche.rb
          if-no-files-found: error

  test-formula:
    needs: [resolve, publish]
    if: always() && needs.publish.result == 'success'
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: homebrew-formula
          path: formula
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Install and test formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew tap-new local/release-test
          cp formula/recherche.rb "$(brew --repository local/release-test)/Formula/recherche.rb"
          brew install local/release-test/recherche
          brew test local/release-test/recherche

  update-tap:
    needs: [resolve, test-formula]
    if: always() && needs.test-formula.result == 'success'
    runs-on: ubuntu-24.04
    env:
      JRELEASER_PROJECT_VERSION: ${{ needs.resolve.outputs.version }}
      JRELEASER_TAG_NAME: ${{ needs.resolve.outputs.tag }}
      JRELEASER_GITHUB_TOKEN: ${{ github.token }}
      JRELEASER_HOMEBREW_GITHUB_TOKEN: ${{ secrets.JRELEASER_HOMEBREW_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true
      - name: Check tap credentials
        run: test -n "$JRELEASER_HOMEBREW_GITHUB_TOKEN" || { echo 'Set the JRELEASER_HOMEBREW_GITHUB_TOKEN Actions secret with contents-write access to homebrew-tap'; exit 1; }
      - uses: jreleaser/release-action@v2
        with:
          version: ${{ env.JRELEASER_VERSION }}
          arguments: prepare -PskipArchiveResolver
      - uses: jreleaser/release-action@v2
        with:
          version: ${{ env.JRELEASER_VERSION }}
          arguments: publish -PskipArchiveResolver
